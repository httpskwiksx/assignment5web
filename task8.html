<html lang="en">
<head>

    <main>
        <h1>Task 8: Interactive To-Do List</h1>
        <p class="description">Add tasks, mark them as completed, and delete them.</p>
        <label for="taskInput">New task:</label>
        <div class="todo-controls">
            <input type="text" id="taskInput" placeholder="Enter your task">
            <button type="button" id="addTask">Add Task</button>
        </div>
        <p id="taskMessage" role="status" aria-live="polite"></p>
        <ul id="taskList" class="todo-list"></ul>
    </main>

    <script src="JS/task8.js"></script>
