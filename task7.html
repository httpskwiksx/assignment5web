    <main>
        <h1>Task 7: Calculator</h1>
        <p class="description">Enter two numbers and choose an arithmetic operation.</p>
        <label for="firstNumber">First number:</label>
        <input type="number" id="firstNumber" step="any" placeholder="Enter first number">

        <label for="secondNumber">Second number:</label>
        <input type="number" id="secondNumber" step="any" placeholder="Enter second number">

        <div class="button-group">
            <button type="button" id="add">+</button>
            <button type="button" id="subtract">−</button>
            <button type="button" id="multiply">×</button>
            <button type="button" id="divide">÷</button>
        </div>
        <p id="result" role="status" aria-live="polite">Result will appear here.</p>
    </main>

    <script src="JS/task7.js"></script>
